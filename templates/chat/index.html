{% extends "base.html" %}
{% block title %}AI Chat - AI Career Connect{% endblock %}

{% block content %}
<div class="row" style="height: 75vh;">
    <!-- ── Sidebar: Conversation List ── -->
    <div class="col-md-3 border-end">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Chats</h5>
            <button class="btn btn-sm btn-primary" id="btn-new-chat">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>
        <div class="list-group" id="conversation-list">
            {% for conv in conversations %}
            <a href="#" class="list-group-item list-group-item-action"
               data-conv-id="{{ conv.id }}">
                {{ conv.title }}
            </a>
            {% endfor %}
        </div>
    </div>

    <!-- ── Chat Area ── -->
    <div class="col-md-9 d-flex flex-column">
        <div class="flex-grow-1 overflow-auto p-3" id="chat-messages">
            <p class="text-muted text-center mt-5">Select a conversation or start a new one.</p>
        </div>

        <!-- ── Input Bar ── -->
        <div class="border-top p-3">
            <form id="chat-form" class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary" id="btn-voice"
                        title="Voice Input">
                    <i class="bi bi-mic"></i>
                </button>
                <input type="text" class="form-control" id="chat-input"
                       placeholder="Type your message..." autocomplete="off">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
